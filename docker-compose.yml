version: "3.9"

services:
  mongo:
    image: mongo:8
    container_name: farmacia_mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: franpier10

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: